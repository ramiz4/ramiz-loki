# Workflow for cleaning up PR preview deployments
name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      
      - name: Remove PR preview directory
        run: |
          # Configure git
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          
          # Check if PR preview directory exists
          if [ -d "pr-${{ github.event.pull_request.number }}" ]; then
            rm -rf pr-${{ github.event.pull_request.number }}
            git add .
            if ! git diff --staged --quiet; then
              git commit -m "Remove PR #${{ github.event.pull_request.number }} preview"
              git push
            fi
          else
            echo "PR preview directory not found, nothing to clean up"
          fi
      
      - name: Comment PR about cleanup
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const prNumber = context.issue.number;
            const commentBody = `## 🧹 Preview Cleanup

            The preview deployment for this PR has been removed.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });
